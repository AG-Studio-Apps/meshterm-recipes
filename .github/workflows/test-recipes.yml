# Validates recipes.json (the app's own rules, scripts/validate.py) and runs every recipe on a fresh-distro Docker
# matrix, as root and as a sudo user, asserting each result (scripts/run-recipes.py, each variant's `ci` block).
#
# Runs weekly (distro rot: a package renamed or dropped upstream turns this red before a person meets it), on demand,
# and from publish.yml before anything is signed (workflow_call): that run is THE test of a change, including the
# declared-changes check against the main it replaces. Pull requests start no run at all (James 2026-10-13: "The merge
# tests are the test"; 2026-10-17: no separate test run, the publish run duplicates it). No secrets, no write permission; the containers run third-party
# packages, so the checkout keeps no credentials.
name: Test recipes

on:
  workflow_dispatch:
  schedule:
    - cron: "0 5 * * 1"  # Mondays 05:00 UTC
  workflow_call:

permissions:
  contents: read

jobs:
  validate:
    name: Validate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Self-test the validator
        run: python3 scripts/validate.py --self-test
      - name: Validate recipes.json against main
        env:
          BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          # From publish.yml (a push to main): check against the main this push replaced.
          base=""
          if [ "${GITHUB_EVENT_NAME}" = push ]; then
            base="${BEFORE_SHA}"
            case "$base" in ""|0000000000000000000000000000000000000000) base=$(git rev-parse -q --verify HEAD^1 || true) ;; esac
          fi
          if [ -n "$base" ] && git cat-file -e "${base}^{commit}" 2>/dev/null; then
            python3 scripts/validate.py --previous-ref "$base"
            # A change that raises the serial lists every app-visible change it makes in
            # ci/serial<N>-declared.json (scripts/validate.py --declared); one that keeps the serial changes no data.
            serial() { python3 -c 'import json, sys; print(json.load(sys.stdin)["serial"])'; }
            new=$(serial < recipes.json)
            old=$(git show "${base}:recipes.json" | serial)
            if [ "$new" != "$old" ]; then
              if [ ! -f "ci/serial${new}-declared.json" ]; then
                echo "::error::serial ${old} -> ${new}: list the changes in ci/serial${new}-declared.json"
                exit 1
              fi
              python3 scripts/validate.py --declared "ci/serial${new}-declared.json" \
                --baseline ci/serial3-baseline.json --previous-ref "$base"
            fi
          else
            python3 scripts/validate.py
          fi

  distro:
    name: ${{ matrix.image }} (${{ matrix.mode }})
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        # Keep in step with ci/images.json.
        image: ["debian:12", "debian:13", "ubuntu:22.04", "ubuntu:24.04", "fedora:latest", "rockylinux/rockylinux:9", "alpine:3.20",
                "amazonlinux:2023", "archlinux:latest", "opensuse/leap:15.6"]
        mode: [root, user]
        # The app's su -c form (a host with no sudo), on the images ci/images.json marks suMode.
        include:
          - image: "debian:12"
            mode: su
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run the recipes
        run: python3 scripts/run-recipes.py --image "${{ matrix.image }}" --mode "${{ matrix.mode }}" --summary "$GITHUB_STEP_SUMMARY"
