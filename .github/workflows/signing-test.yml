name: Signing test
on: workflow_dispatch
permissions:
  contents: read
jobs:
  sign:
    runs-on: ubuntu-latest
    environment: recipes-signing
    steps:
      - uses: actions/checkout@v5
      - name: Install minisign
        run: sudo apt-get update -qq && sudo apt-get install -y -qq minisign
      - name: Sign and verify a test file
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -eu
          key=$(mktemp); trap 'rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          echo "meshterm-recipes signing test $(date -u +%FT%TZ)" > test.txt
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m test.txt -t "kind:signing-test" >/dev/null
          minisign -V -q -p keys/recipes-primary.pub -m test.txt -x test.txt.minisig && echo "VERIFIED against the pinned primary key"
