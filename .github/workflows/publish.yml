# Gates recipes.json, signs it and deploys it to GitHub Pages with its signature as ONE artifact, so the body and
# its signature change together. Modelled on meshdeck-docs' publish.yml (the template catalogue): the SAME minisign
# keys (primary 862A29760F5FC812, emergency 61B6FABFCE0C67A9), a DISTINCT trusted comment, so a signed catalogue can
# never be accepted as recipes:
#
#   recipes=host-recipes version=<serial> date=<YYYY-MM-DD> commit=<sha>      (primary, signed here)
#   recipes=host-recipes version=<serial> date=<YYYY-MM-DD>                   (emergency, committed, signed offline)
#
#   test    the validator and the fresh-distro matrix (test-recipes.yml): nothing is signed unless every recipe ran.
#   build   no secrets. Validates against the DEPLOYED commit (serial up, nothing dropped), stages the site, writes
#           the summary the signer reads (the diff of recipes.json, and a banner when the pipeline itself changed),
#           and decides how the file is signed:
#             reuse      recipes.json is byte-identical to the live one and the live signature verifies: copy it,
#                        no approval needed (README-only pushes).
#             emergency  a committed recipes.json.minisig, made offline with the emergency key
#                        (scripts/sign-emergency.sh), already verified here.
#             sign       anything else: the sign job signs with the primary key.
#   sign    environment `recipes-signing` (main only; a required reviewer; self-review allowed). Runs no repository script: checks the
#           environment still requires a reviewer, compares the artifact with the commit, signs, verifies, uploads.
#   verify  no secrets, no repository script: the Pages artifact holds this commit's recipes.json and a signature that
#           verifies against the pinned keys with the comment the mode calls for.
#   deploy  actions/deploy-pages.
#   smoke   fetches the live pair with a cache-busting query and verifies it again.
#
# Pull requests run test-recipes.yml on their own; this workflow runs on main only. No pull_request_target, ever.
# Every action is pinned by commit SHA.
#
# Per-schema path (meshTerm docs/recipes-v3-plan.md 2.1(c)): the site serves the same bytes and the same signature at
# `v1/recipes.json` (what apps from 2.3 fetch) and at the root `recipes.json` (what earlier TestFlight builds fetch, kept
# while any is in use). A future schema 2 publishes `recipes-v2.json` to `v2/`, signed on its own. A minisign
# signature covers the body only, so one signature serves both paths; verify and smoke check both.
#
# Key rotation touches FOUR places that must move together: keys/recipes-<role>.pub here, the key ids below,
# meshdeck-docs (the catalogue shares the keys), and the apps' pinned keys (meshTerm CatalogTrust).
name: Publish recipes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: pages
  cancel-in-progress: false

env:
  RECIPES_URL: https://ag-studio-apps.github.io/meshterm-recipes/recipes.json
  RECIPES_V1_URL: https://ag-studio-apps.github.io/meshterm-recipes/v1/recipes.json
  PRIMARY_KEY_ID: 862A29760F5FC812
  EMERGENCY_KEY_ID: 61B6FABFCE0C67A9

jobs:
  test:
    name: Test the recipes
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
    uses: ./.github/workflows/test-recipes.yml

  build:
    name: Build and gate
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      deployments: read
    outputs:
      mode: ${{ steps.mode.outputs.mode }}
      serial: ${{ steps.mode.outputs.serial }}
      date: ${{ steps.mode.outputs.date }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      # Before any repository script runs, so an edited script cannot hide it.
      - name: Find the deployed commit, flag pipeline changes
        id: deployed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sha=""
          for id in $(gh api "repos/$GITHUB_REPOSITORY/deployments?environment=github-pages&per_page=50" --jq '.[].id'); do
            ok=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id/statuses?per_page=100" --jq '[.[] | select(.state == "success")] | length')
            if [ "$ok" != 0 ]; then
              sha=$(gh api "repos/$GITHUB_REPOSITORY/deployments/$id" --jq .sha)
              break
            fi
          done
          if [ -z "$sha" ]; then
            {
              echo '> [!NOTE]'
              echo '> **First publish:** no earlier Pages deployment, so there is no deployed recipes.json to compare'
              echo '> with. Read the whole file before approving the signature.'
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "sha=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git cat-file -e "$sha^{commit}" 2>/dev/null || git fetch --no-tags --depth=1 origin "$sha"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          changed=$(git diff --name-only "$sha" HEAD -- .github scripts keys ci)
          if [ -n "$changed" ]; then
            {
              echo '> [!WARNING]'
              echo "> **This push changes the publishing pipeline itself** since the deployed commit \`${sha:0:12}\`."
              echo '> The summary below is produced by that code, so it cannot vouch for itself. Before approving'
              echo '> the signing job, read the commit diff on github.com, not this page. Changed:'
              for path in $changed; do
                echo "> - \`$(printf '%s' "$path" | tr -c 'A-Za-z0-9._/@+=-' '?')\`"
              done
              echo
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::warning::This push changes .github/, scripts/, keys/ or ci/; read the diff before approving the signature."
          fi

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Validate against the deployed commit
        env:
          DEPLOYED_SHA: ${{ steps.deployed.outputs.sha }}
        run: |
          set -euo pipefail
          if [ -n "$DEPLOYED_SHA" ]; then
            python3 scripts/validate.py --previous-ref "$DEPLOYED_SHA"
            {
              echo '### recipes.json since the deployed commit'
              echo
              echo '```diff'
              git diff "$DEPLOYED_SHA" HEAD -- recipes.json | head -400
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/validate.py
          fi

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/recipes-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/recipes-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Stage the site and choose how recipes.json is signed
        id: mode
        run: |
          set -euo pipefail
          serial=$(python3 -c 'import json; print(json.load(open("recipes.json"))["serial"])')
          date=$(python3 -c 'import json; print(json.load(open("recipes.json"))["date"])')
          echo "serial=$serial" >> "$GITHUB_OUTPUT"
          echo "date=$date" >> "$GITHUB_OUTPUT"
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          mkdir -p "$site/keys" "$site/v1"
          cp recipes.json recipes.schema.json "$site/"
          cp recipes.json "$site/v1/recipes.json"
          cp keys/recipes-primary.pub keys/recipes-emergency.pub "$site/keys/"
          cp site/index.html "$site/index.html"
          touch "$site/.nojekyll"
          if python3 scripts/recipes_signature.py reuse --url "$RECIPES_URL" --body recipes.json \
               --out "$site/recipes.json.minisig"; then
            cp "$site/recipes.json.minisig" "$site/v1/recipes.json.minisig"
            mode=reuse
            line="**Signature:** the live signature of serial $serial is reused (recipes.json did not change). No approval is needed."
          elif [ -f recipes.json.minisig ]; then
            python3 scripts/recipes_signature.py verify --body recipes.json --sig recipes.json.minisig --role emergency --expect-serial "$serial"
            mode=emergency
            line="**Signature:** the committed EMERGENCY signature of serial $serial is used (verified above). Approve the \`recipes-signing\` job to publish it."
          else
            mode=sign
            line="**Signature:** serial $serial ($date) needs a new signature. Approve the \`recipes-signing\` job only after reading this summary and the diff."
          fi
          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          { echo; echo "$line"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Pack the site for signing
        if: steps.mode.outputs.mode != 'reuse'
        run: tar -C "$RUNNER_TEMP/site" -cf "$RUNNER_TEMP/site.tar" .

      - name: Upload the site for signing
        if: steps.mode.outputs.mode != 'reuse'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/site.tar
          retention-days: 1
          if-no-files-found: error

      - name: Upload the Pages artifact (live signature reused)
        if: steps.mode.outputs.mode == 'reuse'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  sign:
    name: Sign recipes.json
    needs: build
    if: github.ref == 'refs/heads/main' && needs.build.outputs.mode != 'reuse'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: recipes-signing
    permissions:
      contents: read
      actions: read
    env:
      MODE: ${{ needs.build.outputs.mode }}
      SERIAL: ${{ needs.build.outputs.serial }}
      DATE: ${{ needs.build.outputs.date }}
    steps:
      # Fails closed when the environment no longer gates this job: a required reviewer, deployments limited to main,
      # and no administrator bypass (the same three checks as the template catalogue's sign job). Self-review is
      # deliberately allowed: James is the only reviewer and approves his own runs, as for the catalogue.
      - name: Check the environment still requires a reviewer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api() {
            gh api "$1" 2>/dev/null \
              || curl -fsS --max-time 20 -H 'Accept: application/vnd.github+json' "https://api.github.com/$1"
          }
          ENV_JSON=$(api "repos/$GITHUB_REPOSITORY/environments/recipes-signing")
          POLICIES_JSON=$(api "repos/$GITHUB_REPOSITORY/environments/recipes-signing/deployment-branch-policies")
          export ENV_JSON POLICIES_JSON
          python3 - <<'PY'
          import json, os, sys
          env = json.loads(os.environ["ENV_JSON"])
          policies = json.loads(os.environ["POLICIES_JSON"])
          rules = [r for r in env.get("protection_rules") or [] if r.get("type") == "required_reviewers"]
          reviewers = [who for rule in rules for who in rule.get("reviewers") or []]
          problems = []
          if not reviewers:
              problems.append("has no required reviewer")
          if env.get("can_admins_bypass") is not False:
              problems.append("lets administrators bypass its protection rules")
          names = sorted(f"{p.get('type')}:{p.get('name')}" for p in policies.get("branch_policies") or [])
          if not (env.get("deployment_branch_policy") or {}).get("custom_branch_policies") or names != ["branch:main"]:
              problems.append(f"does not limit deployments to main alone ({', '.join(names) or 'no branch policy'})")
          for problem in problems:
              print(f"::error::Refusing to sign: the recipes-signing environment {problem}. Fix it in Settings > Environments, then re-run.")
          if problems:
              sys.exit(1)
          print(f"recipes-signing: {len(reviewers)} required reviewer(s), administrators cannot bypass, main only.")
          PY

      # Only recipes.json, a committed emergency signature and the public keys: no scripts.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recipes.json
            /recipes.json.minisig
            /keys/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site-unsigned
          path: ${{ runner.temp }}/in

      # The build job ran repository scripts, so its tarball is untrusted input here: regular files and directories
      # only (upload-pages-artifact packs with tar --dereference), unpacked outside the checkout.
      - name: Unpack and compare with the commit
        run: |
          set -euo pipefail
          bad=$(tar -tvf "$RUNNER_TEMP/in/site.tar" | grep -v '^[-d]' || true)
          if [ -n "$bad" ]; then
            echo "::error::the build artifact holds entries that are not regular files or directories"
            printf '%s\n' "$bad" | head -20
            exit 1
          fi
          site="$RUNNER_TEMP/site"
          rm -rf "$site"
          mkdir "$site"
          tar -C "$site" --no-same-owner --no-same-permissions -xf "$RUNNER_TEMP/in/site.tar"
          left=$(find "$site" ! -type f ! -type d | head -5)
          [ -z "$left" ] || { echo "::error::unexpected entries after unpacking: $left"; exit 1; }
          cmp "$site/recipes.json" recipes.json
          cmp "$site/v1/recipes.json" recipes.json
          read -r body_serial body_date < <(python3 - <<'PY'
          import json, re
          def pairs(items):
              keys = [key for key, _ in items]
              if len(set(keys)) != len(keys):
                  raise SystemExit("recipes.json has a duplicate key")
              return dict(items)
          doc = json.load(open("recipes.json", encoding="utf-8"), object_pairs_hook=pairs)
          assert doc["kind"] == "host-recipes"
          assert type(doc["serial"]) is int and doc["serial"] > 0
          assert re.fullmatch(r"[0-9]{4}-[0-9]{2}-[0-9]{2}", doc["date"])
          print(doc["serial"], doc["date"])
          PY
          )
          [ "$body_serial" = "$SERIAL" ] || { echo "::error::recipes.json is serial $body_serial, the build said $SERIAL"; exit 1; }
          [ "$body_date" = "$DATE" ] || { echo "::error::recipes.json is dated $body_date, the build said $DATE"; exit 1; }
          case "$MODE" in sign|emergency) ;; *) echo "::error::unknown mode $MODE"; exit 1 ;; esac

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign
          minisign -v

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/recipes-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/recipes-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: Use the committed emergency signature
        if: env.MODE == 'emergency'
        run: |
          set -euo pipefail
          test -f recipes.json.minisig
          cp recipes.json.minisig "$RUNNER_TEMP/site/recipes.json.minisig"

      - name: Sign with the primary key
        if: env.MODE == 'sign'
        env:
          MINISIGN_KEY: ${{ secrets.MINISIGN_KEY }}
          MINISIGN_PASSWORD: ${{ secrets.MINISIGN_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          if [ -z "${MINISIGN_KEY:-}" ] || [ -z "${MINISIGN_PASSWORD:-}" ]; then
            echo "::error::MINISIGN_KEY / MINISIGN_PASSWORD are not set in the recipes-signing environment."
            exit 1
          fi
          key="$RUNNER_TEMP/recipes-primary.key"
          trap 'shred -u "$key" 2>/dev/null || rm -f "$key"' EXIT
          printf '%s\n' "$MINISIGN_KEY" > "$key"
          site="$RUNNER_TEMP/site"
          rm -f "$site/recipes.json.minisig"
          printf '%s\n' "$MINISIGN_PASSWORD" | minisign -S -s "$key" -m "$site/recipes.json" \
            -x "$site/recipes.json.minisig" -t "recipes=host-recipes version=$SERIAL date=$DATE commit=$GITHUB_SHA" >/dev/null

      - name: Verify before publishing
        run: |
          set -euo pipefail
          site="$RUNNER_TEMP/site"
          if [ "$MODE" = emergency ]; then
            pub=keys/recipes-emergency.pub
            want="trusted comment: recipes=host-recipes version=$SERIAL date=$DATE"
          else
            pub=keys/recipes-primary.pub
            want="trusted comment: recipes=host-recipes version=$SERIAL date=$DATE commit=$GITHUB_SHA"
          fi
          # One signature serves both paths (it covers the body only).
          cp "$site/recipes.json.minisig" "$site/v1/recipes.json.minisig"
          minisign -V -q -p "$pub" -m "$site/recipes.json" -x "$site/recipes.json.minisig"
          minisign -V -q -p "$pub" -m "$site/v1/recipes.json" -x "$site/v1/recipes.json.minisig"
          got=$(sed -n 3p "$site/recipes.json.minisig")
          [ "$got" = "$want" ] || { echo "::error::trusted comment is '$got', expected '$want'"; exit 1; }
          echo "Verified against $pub: ${got#trusted comment: }" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Upload the Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  verify:
    name: Check the Pages artifact
    needs: [build, sign]
    if: >-
      !cancelled() && github.ref == 'refs/heads/main'
      && needs.build.result == 'success'
      && (needs.sign.result == 'success' || (needs.sign.result == 'skipped' && needs.build.outputs.mode == 'reuse'))
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      MODE: ${{ needs.build.outputs.mode }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recipes.json
            /keys/

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: github-pages
          path: ${{ runner.temp }}/pages

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      - name: Check the public keys are the pinned ones
        run: |
          set -euo pipefail
          for pair in "primary:$PRIMARY_KEY_ID" "emergency:$EMERGENCY_KEY_ID"; do
            role=${pair%%:*}; want=${pair#*:}
            got=$(python3 -c 'import base64, sys; b = base64.b64decode(open(sys.argv[1]).read().splitlines()[1]); assert len(b) == 42 and b[:2] == b"Ed"; print(b[2:10][::-1].hex().upper())' "keys/recipes-$role.pub")
            [ "$got" = "$want" ] || { echo "::error::keys/recipes-$role.pub has key id $got, the workflow pins $want"; exit 1; }
          done

      - name: The artifact holds this commit's recipes.json and a valid signature
        run: |
          set -euo pipefail
          tarball="$RUNNER_TEMP/pages/artifact.tar"
          bad=$(tar -tvf "$tarball" | grep -v '^[-d]' || true)
          [ -z "$bad" ] || { echo "::error::the Pages artifact holds entries that are not regular files or directories"; exit 1; }
          site="$RUNNER_TEMP/check"
          rm -rf "$site"
          mkdir "$site"
          tar -C "$site" --no-same-owner --no-same-permissions -xf "$tarball"
          cmp "$site/recipes.json" recipes.json
          test -f "$site/recipes.json.minisig" || { echo "::error::the Pages artifact has no recipes.json.minisig"; exit 1; }
          # The per-schema path: the same body and the same signature.
          cmp "$site/v1/recipes.json" recipes.json
          cmp "$site/v1/recipes.json.minisig" "$site/recipes.json.minisig"
          read -r serial date < <(python3 -c 'import json; d = json.load(open("recipes.json")); print(d["serial"], d["date"])')
          case "$MODE" in
            sign)      roles="primary";           pattern="^recipes=host-recipes version=$serial date=$date commit=$GITHUB_SHA\$" ;;
            emergency) roles="emergency";         pattern="^recipes=host-recipes version=$serial date=$date\$" ;;
            reuse)     roles="primary emergency"; pattern="^recipes=host-recipes version=$serial date=$date( commit=[0-9a-f]{40})?\$" ;;
            *) echo "::error::unknown mode $MODE"; exit 1 ;;
          esac
          line=$(sed -n 3p "$site/recipes.json.minisig")
          comment=${line#trusted comment: }
          if [ "$line" = "$comment" ] || ! printf '%s\n' "$comment" | grep -Eq "$pattern"; then
            echo "::error::trusted comment '$line' is not what $MODE mode publishes for serial $serial"
            exit 1
          fi
          signer=""
          for role in $roles; do
            if minisign -V -q -p "keys/recipes-$role.pub" -m "$site/recipes.json" -x "$site/recipes.json.minisig" 2>/dev/null; then
              signer=$role
              break
            fi
          done
          [ -n "$signer" ] || { echo "::error::recipes.json.minisig does not verify against keys/recipes-{${roles// /,}}.pub"; exit 1; }
          echo "Pages artifact checked: recipes.json serial $serial ($MODE mode), signed by the $signer key: $comment" \
            | tee -a "$GITHUB_STEP_SUMMARY"

  deploy:
    name: Deploy to Pages
    needs: verify
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && needs.verify.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  smoke:
    name: Verify the live pair
    needs: deploy
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /recipes.json
            /keys/
            /scripts/recipes_signature.py

      - name: Install minisign
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq minisign

      # The CDN caches each file for up to 600 s; a lagging serial after ~10 minutes is a warning, a signature that
      # does not verify (or a live serial above this one) fails the job.
      - name: Fetch and verify the live recipes.json and its signature (v1/, what apps from 2.3 read)
        run: python3 scripts/recipes_signature.py smoke --url "$RECIPES_V1_URL" --expect-body recipes.json --tries 4 --interval 200

      - name: Fetch and verify the live recipes.json and its signature (root, earlier TestFlight builds)
        run: python3 scripts/recipes_signature.py smoke --url "$RECIPES_URL" --expect-body recipes.json --tries 4 --interval 200
